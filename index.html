<!--
    Install Libraries using NPM
    Terminal or PowerSheel cd "Main App Folder"
    npm install babylonjs --save 
    npm install babylonjs-loaders --save
    npm i pepjs
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="robots" content="noindex">
    <title>Retro Arcade Gaming</title>
    <!-- Main StyleSheet -->
    <link rel="stylesheet" href="./css/main.css?id=29">
    <!-- Bootstrap 5.0.2 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Loading DIV -->
    <div id="loadingDiv">
        <p id="loadingText" class="font-weight-light">L O A D I N G</p>
        <span class="loader"></span>
    </div>
    <!-- BabylonJS Render Canvas -->
    <canvas id="renderCanvas"></canvas>

    <!-- Info Card -->
    <div class="info-card" id="info-card">
        <button class="close-bt" onclick="hideInfoCard()">X</button>
        <h2 id="info-title">Information</h2>
        <p id="info-description">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Perspiciatis iure sapiente ipsum architecto iusto laboriosam earum eaque dolor.</p>
        <div class="panel-colors" id="panel-colors">
            <button class="color-bt" id="color-bt-0" style="background-color: #edeadcff;" onclick="setPanelColor(0)"></button>
            <button class="color-bt" id="color-bt-1" style="background-color: #60c5ff;" onclick="setPanelColor(1)"></button>
            <button class="color-bt" id="color-bt-2" style="background-color: #c44141;" onclick="setPanelColor(2)"></button>
            <button class="color-bt" id="color-bt-3" style="background-color: #ec8cc7;" onclick="setPanelColor(3)"></button>
            <button class="color-bt" id="color-bt-4" style="background-color: #1b1b1b;" onclick="setPanelColor(4)"></button>
        </div>
    </div>
    

    <!-- Title -->
    <h2 class="main-title" id="main-title">Retro Arcade<br>Gaming</h2>

    <!-- Intro Text -->
    <h2 class="intro-text" id="intro-text">SELECT THE DIFFERENT PARTS</h2>

    <!-- JS Libraries -->
    <script src="./node_modules/babylonjs/babylon.js"></script> 
    <script src="./node_modules/babylonjs-loaders/babylonjs.loaders.min.js"></script> 
    <script src="./node_modules/pepjs/dist/pep.js"></script>
    <!-- JS Main App -->
    <script src="./js/main.js?id=29"></script>
</body>
</html>
